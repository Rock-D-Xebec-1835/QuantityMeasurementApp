<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- Your CSS -->

</head>
<body>

    <h1 id="title">QUANTITY MEASUREMENT APP</h1>

    <p id = "type">CHOOSE THE TYPE OF QUANTITY</p>

    <div class="types">
            <div class="card mb-3 cards" style="max-width: 18rem;">
    <div class="card-body">
        <h5 class="card-title">Length</h5>
        <i class="fa-solid fa-ruler"></i>
    </div>
    </div>

    <div class="card mb-3 cards" style="max-width: 18rem;">
    
    <div class="card-body">
        <h5 class="card-title">Weight</h5>
        <i class="fa-solid fa-weight-hanging"></i>
    </div>
    </div>

    <div class="card mb-3 cards" style="max-width: 18rem;">
    
    <div class="card-body">
        <h5 class="card-title">Temperature</h5>
        <i class="fa-solid fa-temperature-half"></i>
    </div>
    </div>

    <div class="card mb-3 cards" style="max-width: 18rem;">
    
    <div class="card-body">
        <h5 class="card-title">Volume</h5>
        <i class="fa-solid fa-flask"></i>
    </div>
    </div>
</div>


<p id = "type">CHOOSE THE TYPE OF QUANTITY</p>

<div class="buttons">
    <button class="actions">Comparision</button>
    <button class="actions">Conversion</button>
    <button class="actions">Arithmetic</button>
</div>
    

<div class="fromnto">
    <div class="from">
        <input id="input" type="number" placeholder="0">
        <select class="unit-select">
            <option>Kilometer</option>
            <option>Meter</option>
            <option>Centimeter</option>
            <option>Millimeter</option>
            <option>Mile</option>
            <option>Yard</option>
            <option>Feet</option>
            <option>Inch</option>
        </select>
    </div>
    <div class="to">
        <p id="output">0</p>
        <select class="unit-select">
            <option>Kilometer</option>
            <option>Meter</option>
            <option>Centimeter</option>
            <option>Millimeter</option>
            <option>Mile</option>
            <option>Yard</option>
            <option>Feet</option>
            <option>Inch</option>
        </select>
    </div>
</div>
    
</body>
</html>
